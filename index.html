<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Panel de Control - Roblox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            background: rgba(0, 255, 100, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 100, 0.2);
        }

        .status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff64;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============================================
           GRID
           ============================================ */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================
           CARDS
           ============================================ */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #aaa;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 .badge {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: none;
        }

        /* ============================================
           LOGS
           ============================================ */
        .logs-container {
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
        }

        .logs-container::-webkit-scrollbar {
            width: 6px;
        }

        .logs-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .logs-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 12px;
        }

        .log-time {
            color: #555;
            min-width: 75px;
        }

        .log-event {
            color: #ffd700;
            font-weight: 600;
        }

        .log-data {
            color: #8af;
            word-break: break-all;
        }

        .log-info {
            color: #8f8;
        }

        .log-warn {
            color: #fa8;
        }

        .log-error {
            color: #f66;
        }

        .empty-logs {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-style: italic;
        }

        /* ============================================
           COMANDOS
           ============================================ */
        .command-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .command-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .command-row input,
        .command-row select {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .command-row input:focus,
        .command-row select:focus {
            outline: none;
            border-color: #ffd700;
        }

        .command-row input::placeholder {
            color: #555;
        }

        .command-row select option {
            background: #1a1a2e;
            color: white;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 75, 43, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #1a1a2e;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.3);
        }

        .btn-purple {
            background: linear-gradient(135deg, #7f00ff, #e100ff);
            color: white;
        }

        .btn-purple:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(225, 0, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================
           QUICK ACTIONS
           ============================================ */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .quick-actions .btn {
            flex: 1;
            min-width: 100px;
            justify-content: center;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .header h1 { font-size: 20px; }
            .command-row { flex-direction: column; }
            .command-row input,
            .command-row select { min-width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .quick-actions .btn { min-width: 80px; font-size: 12px; padding: 8px 12px; }
        }

        /* ============================================
           TOAST NOTIFICATION
           ============================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            max-width: 90vw;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: #38ef7d; }
        .toast.error { border-color: #ff416c; }
        .toast.info { border-color: #7f00ff; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🎮 Panel de Control</h1>
            <div class="status">
                <span class="dot"></span>
                <span>Conectado a Roblox</span>
                <span style="opacity:0.5;margin-left:8px;">|</span>
                <span style="opacity:0.6;font-size:12px;">Token: CRIS2026</span>
            </div>
        </div>

        <!-- GRID -->
        <div class="grid">
            <!-- COLUMNA IZQUIERDA: COMANDOS -->
            <div class="card">
                <h2>⌨️ Enviar Comando <span class="badge">Polling cada 5s</span></h2>

                <div class="command-group">
                    <!-- Comando: Acción + Jugador + Cantidad -->
                    <div class="command-row">
                        <select id="cmdAction">
                            <option value="give_coins">🪙 Dar monedas</option>
                            <option value="give_diamonds">💎 Dar diamantes</option>
                            <option value="give_seed">🌱 Dar semilla</option>
                            <option value="set_day">☀️ Cambiar a día</option>
                            <option value="set_night">🌙 Cambiar a noche</option>
                            <option value="kick">🚫 Expulsar jugador</option>
                            <option value="broadcast">📢 Broadcast</option>
                        </select>
                        <input type="text" id="cmdPlayer" placeholder="Nombre del jugador (opcional)">
                        <input type="number" id="cmdAmount" placeholder="Cantidad" value="10" min="1" style="max-width:100px;">
                    </div>

                    <!-- Campo extra para seedType o mensaje -->
                    <div class="command-row" id="extraField" style="display:none;">
                        <input type="text" id="cmdExtra" placeholder="Semilla (AppleSeed / StrawberrySeed)">
                    </div>

                    <!-- Botón Enviar -->
                    <button class="btn btn-primary" onclick="sendCommand()" style="width:100%;justify-content:center;padding:12px;">
                        🚀 Enviar Comando
                    </button>

                    <!-- Acciones Rápidas -->
                    <div class="quick-actions">
                        <button class="btn btn-success" onclick="quickSend('set_day')">☀️ Día</button>
                        <button class="btn btn-purple" onclick="quickSend('set_night')">🌙 Noche</button>
                        <button class="btn btn-secondary" onclick="quickSendCoins(100)">🪙 +100</button>
                        <button class="btn btn-secondary" onclick="quickSendCoins(1000)">🪙 +1000</button>
                        <button class="btn btn-danger" onclick="quickSend('kick')">🚫 Kick</button>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: ESTADO Y SERVIDOR -->
            <div class="card">
                <h2>📊 Estado del Servidor</h2>
                <div style="display:flex;flex-direction:column;gap:12px;">
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <div style="flex:1;background:rgba(255,255,255,0.05);padding:12px 16px;border-radius:10px;">
                            <div style="font-size:11px;color:#666;text-transform:uppercase;">Comandos pendientes</div>
                            <div style="font-size:28px;font-weight:700;color:#ffd700;" id="pendingCount">0</div>
                        </div>
                        <div style="flex:1;background:rgba(255,255,255,0.05);padding:12px 16px;border-radius:10px;">
                            <div style="font-size:11px;color:#666;text-transform:uppercase;">Última respuesta</div>
                            <div style="font-size:14px;color:#8f8;" id="lastResponse">Esperando...</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="checkPending()" style="width:100%;justify-content:center;">
                        🔄 Ver comandos pendientes
                    </button>
                </div>
            </div>
        </div>

        <!-- LOGS -->
        <div class="card">
            <h2>📜 Logs en Tiempo Real <span class="badge" id="logCount">0 eventos</span></h2>
            <div class="logs-container" id="logsContainer">
                <div class="empty-logs">Esperando eventos... Los logs aparecerán aquí</div>
            </div>
            <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="clearLogs()" style="flex:1;">🗑️ Limpiar logs</button>
                <button class="btn btn-secondary" onclick="fetchLogs()" style="flex:1;">🔄 Recargar logs</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        //  CONFIGURACIÓN
        // ================================================================
        const API_BASE = window.location.origin;
        const TOKEN = "CRIS2026";

        let logs = [];
        let logCount = 0;

        // ================================================================
        //  FUNCIÓN: ENVIAR COMANDO
        // ================================================================
        async function sendCommand() {
            const action = document.getElementById('cmdAction').value;
            const player = document.getElementById('cmdPlayer').value.trim();
            const amount = parseInt(document.getElementById('cmdAmount').value) || 0;
            const extra = document.getElementById('cmdExtra').value.trim();

            const payload = { action };
            if (player) payload.player = player;
            if (amount > 0) payload.amount = amount;
            if (extra) payload.seedType = extra;
            if (action === 'broadcast' && extra) payload.message = extra;

            showToast(`📤 Enviando: ${action}...`, 'info');

            try {
                const response = await fetch(`${API_BASE}/api/send_command`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(`✅ Comando enviado: ${action}`, 'success');
                    document.getElementById('lastResponse').textContent = `✅ ${action} (${new Date().toLocaleTimeString()})`;
                    await checkPending();
                } else {
                    showToast(`❌ Error: ${data.error || response.status}`, 'error');
                }
            } catch (err) {
                showToast(`❌ Error de conexión: ${err.message}`, 'error');
            }
        }

        // ================================================================
        //  FUNCIÓN: ENVÍO RÁPIDO
        // ================================================================
        function quickSend(action) {
            document.getElementById('cmdAction').value = action;
            if (action === 'set_day' || action === 'set_night') {
                document.getElementById('cmdPlayer').value = '';
                document.getElementById('cmdAmount').value = 0;
                document.getElementById('cmdExtra').value = '';
            }
            if (action === 'kick') {
                document.getElementById('cmdPlayer').value = prompt('Nombre del jugador a expulsar:') || '';
                document.getElementById('cmdAmount').value = 0;
            }
            sendCommand();
        }

        function quickSendCoins(amount) {
            document.getElementById('cmdAction').value = 'give_coins';
            document.getElementById('cmdAmount').value = amount;
            const player = prompt('Nombre del jugador:') || '';
            document.getElementById('cmdPlayer').value = player;
            sendCommand();
        }

        // ================================================================
        //  FUNCIÓN: VER COMANDOS PENDIENTES
        // ================================================================
        async function checkPending() {
            try {
                const response = await fetch(`${API_BASE}/api/commands?token=${TOKEN}`);
                const data = await response.json();
                if (Array.isArray(data)) {
                    document.getElementById('pendingCount').textContent = data.length;
                    if (data.length > 0) {
                        showToast(`📊 ${data.length} comandos pendientes`, 'info');
                    }
                }
            } catch (err) {
                console.error('Error checking pending:', err);
            }
        }

        // ================================================================
        //  FUNCIÓN: OBTENER LOGS
        // ================================================================
        async function fetchLogs() {
            try {
                const response = await fetch(`${API_BASE}/logs`);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        logs = data;
                        renderLogs();
                    }
                }
            } catch (err) {
                console.error('Error fetching logs:', err);
            }
        }

        // ================================================================
        //  FUNCIÓN: RENDERIZAR LOGS
        // ================================================================
        function renderLogs() {
            const container = document.getElementById('logsContainer');
            if (!logs || logs.length === 0) {
                container.innerHTML = `<div class="empty-logs">Esperando eventos... Los logs aparecerán aquí</div>`;
                document.getElementById('logCount').textContent = '0 eventos';
                return;
            }

            let html = '';
            const reversed = [...logs].reverse();
            for (const log of reversed) {
                const time = new Date(log.timestamp * 1000).toLocaleTimeString();
                const event = log.event || 'info';
                const data = log.data ? JSON.stringify(log.data) : '';
                const colorClass = event.includes('error') ? 'log-error' : 
                                   event.includes('warn') ? 'log-warn' : 
                                   event.includes('success') ? 'log-info' : 'log-event';
                html += `
                    <div class="log-entry">
                        <span class="log-time">${time}</span>
                        <span class="${colorClass}">${event}</span>
                        <span class="log-data">${data}</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('logCount').textContent = `${logs.length} eventos`;
        }

        // ================================================================
        //  FUNCIÓN: LIMPIAR LOGS
        // ================================================================
        function clearLogs() {
            if (confirm('¿Borrar todos los logs?')) {
                logs = [];
                renderLogs();
                showToast('🗑️ Logs borrados', 'info');
            }
        }

        // ================================================================
        //  FUNCIÓN: TOAST NOTIFICATION
        // ================================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            // Forzar reflow
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ================================================================
        //  MOSTRAR/OCULTAR CAMPO EXTRA SEGÚN ACCIÓN
        // ================================================================
        document.getElementById('cmdAction').addEventListener('change', function() {
            const extraField = document.getElementById('extraField');
            const action = this.value;
            if (action === 'give_seed' || action === 'broadcast') {
                extraField.style.display = 'flex';
                document.getElementById('cmdExtra').placeholder = action === 'give_seed' ? 'AppleSeed / StrawberrySeed' : 'Mensaje';
            } else {
                extraField.style.display = 'none';
            }
        });

        // ================================================================
        //  INICIALIZAR
        // ================================================================
        // Cargar logs al inicio
        fetchLogs();

        // Auto-check pendientes cada 10 segundos
        setInterval(checkPending, 10000);

        // Auto-refresh logs cada 15 segundos
        setInterval(fetchLogs, 15000);

        // Verificar pendientes al cargar
        checkPending();

        console.log('🎮 Panel de Control iniciado');
        console.log(`🔐 Token: ${TOKEN}`);
        console.log(`🌐 API Base: ${API_BASE}`);

        // Mostrar toast de bienvenida
        setTimeout(() => {
            showToast('🚀 Panel de Control listo', 'success');
        }, 500);
    </script>
</body>
</html>
